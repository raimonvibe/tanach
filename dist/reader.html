<!DOCTYPE html>
<html lang="en" data-theme="tanach">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanach Reader - Read</title>
    <link rel="icon" type="image/x-icon" href="/jewish-bible.ico">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/read-aloud.css">
    <script src="/js/theme.js"></script>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{color:#333;background:#f8f9fa;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.6}.header{color:#fff;padding:20px 0;padding-top:max(20px, env(safe-area-inset-top));background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);position:relative;box-shadow:0 2px 10px #0000001a}.header-content{flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;max-width:1200px;margin:0 auto;padding:0 20px;display:flex}.header h1{font-size:1.8rem}.nav-controls{flex-wrap:wrap;align-items:center;gap:10px;display:flex}.nav-links{gap:10px;display:flex}.nav-links a{color:#fff;background:#fff3;border-radius:15px;align-items:center;padding:6px 12px;font-size:.9rem;line-height:1.2;text-decoration:none;transition:background .3s;display:inline-flex}.nav-links a:hover{background:#ffffff4d}.main-container{max-width:1200px;margin:0 auto;padding:20px}.book-info{background:#fff;border-radius:15px;margin-bottom:20px;padding:25px;box-shadow:0 5px 15px #0000001a}.book-title{color:#667eea;margin-bottom:10px;font-size:2rem}.chapter-nav{text-align:center;background:#fff;border-radius:15px;margin-bottom:20px;padding:20px;box-shadow:0 5px 15px #0000001a}.content-area{background:#fff;border-radius:15px;margin-bottom:20px;padding:30px;box-shadow:0 5px 15px #0000001a}.language-tabs{border-bottom:2px solid #eee;width:100%;margin-bottom:30px;display:flex;overflow-x:auto}.tab{cursor:pointer;color:#666;white-space:nowrap;text-align:center;background:0 0;border:none;border-bottom:3px solid #0000;flex:1;min-width:0;padding:15px 25px;font-size:1.1rem;transition:all .3s}.tab.active{color:#667eea;border-bottom-color:#667eea}.tab-content{display:none!important}.tab-content.active{visibility:visible!important;opacity:1!important;display:block!important}#tabContent{min-height:200px}#both-content.active,#hebrew-content.active,#english-content.active{visibility:visible!important;display:block!important}.verses{font-size:1.1rem;line-height:1.8}.verse{border-radius:8px;margin-bottom:15px;padding:10px;transition:background-color .3s}.verse:hover{background-color:#f8f9fa}.verse-number{color:#667eea;margin-right:10px;font-weight:700}.verse-number.hidden{display:none}.hebrew-text{text-align:right;direction:rtl;font-family:Times New Roman,serif;font-size:1.2rem}.book-catalog-intro{color:#666;margin-bottom:1.25rem}.book-catalog{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;display:grid}.book-catalog .category{background:#f8f9fa;border-left:5px solid #667eea;border-radius:15px;padding:1.25rem}.book-catalog .category h3{color:#667eea;margin-bottom:.5rem;font-size:1.25rem}.book-catalog .category p{color:#666;margin-bottom:1rem;font-size:.95rem}.books-list{list-style:none}.books-list li{margin-bottom:.5rem}.books-list a{color:#333;border-radius:8px;padding:.5rem .75rem;text-decoration:none;transition:background-color .3s;display:block}.books-list a:hover{background-color:#e9ecef}.book-meta{color:#666}.chapter-buttons{flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0;display:flex}.chapter-btn{color:#fff;cursor:pointer;background:#667eea;border:none;border-radius:8px;min-width:45px;padding:10px 15px;font-size:1rem;transition:all .3s}.chapter-btn:hover{background:#5a6fd8;transform:translateY(-2px)}.chapter-btn.active{background:#764ba2;font-weight:700;box-shadow:0 4px 8px #0003}.nav-btn{color:#fff;cursor:pointer;background:#667eea;border:none;border-radius:8px;padding:10px 15px;font-size:1rem;transition:background-color .3s}.nav-btn:hover:not(:disabled){background:#5a6fd8}.nav-btn:disabled{cursor:not-allowed;opacity:.6;background:#ccc}.loading{text-align:center;color:#666;padding:40px;font-size:1.1rem}.error{color:#c62828;background:#ffebee;border-left:4px solid #c62828;border-radius:8px;margin:20px 0;padding:15px}@media (width<=768px){.header{padding-top:max(15px, env(safe-area-inset-top));padding-bottom:15px}.header-content{flex-direction:column;align-items:flex-start;gap:15px}.nav-controls{flex-wrap:wrap;justify-content:space-between;gap:8px;width:100%}.nav-links{order:-1;justify-content:flex-end;width:100%;margin-bottom:10px}.book-selector,.toggle-btn{padding:8px 12px;font-size:.85rem}.header h1{font-size:1.5rem}.language-tabs{margin-bottom:20px}.tab{flex:1;min-width:80px;padding:12px 15px;font-size:.95rem}.content-area{padding:20px 15px}}@media (width<=480px){.tab{min-width:70px;padding:10px 12px;font-size:.85rem}}</style>
    <script>
        // Immediate console log to verify script execution
        console.log('[Reader HTML] Script tag reached');
        console.log('[Reader HTML] Current URL:', window.location.href);
    </script>
    <script type="module" src="/js/reader.js"></script>
    <script>
        // Log after module script
        console.log('[Reader HTML] Module script tag processed');
    </script>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-P2Xu9kJm.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div>
                <a href="/" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: background-color 0.3s ease;">← Back</a>
                <h1 id="bookTitle">Tanach Reader</h1>
            </div>
            <div class="nav-controls">
                <select id="bookSelector" class="book-selector" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer;">
                    <option value="">Select a book...</option>
                </select>
                <button id="toggleVerseNumbers" class="toggle-btn" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: background-color 0.3s ease; font-size: 0.9rem;">Verse numbers</button>
                <div class="nav-links">
                    <a href="/readings.html">📚 Reading schedule</a>
                    <a href="/calendar.html">📅 Calendar</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div id="bookInfo" class="book-info">
            <div class="loading">Loading books...</div>
        </div>

        <div id="chapterNav" class="chapter-nav" style="display: none;">
            <h3>Chapters</h3>
            <div id="chapterButtons" class="chapter-buttons" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
            <div style="margin-top: 15px;">
                <button id="prevChapter" class="nav-btn" style="background: #667eea; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: background-color 0.3s ease; margin-right: 10px;">← Previous</button>
                <button id="nextChapter" class="nav-btn" style="background: #667eea; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: background-color 0.3s ease;">Next →</button>
            </div>
        </div>

        <div id="contentArea" class="content-area" data-read-aloud-block style="display: none;">
            <div class="language-tabs">
                <button class="tab active" data-tab="hebrew" onclick="switchTab('hebrew')">Hebrew</button>
                <button class="tab active" data-tab="english" onclick="switchTab('english')">English</button>
                <button class="tab active" data-tab="both" onclick="switchTab('both')">Both</button>
            </div>
            <div id="tabContent"></div>
        </div>
    </div>
    <script>
        // Add event listeners after DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[Reader HTML] DOM loaded, setting up event listeners');
            
            // Book selector change event
            const bookSelector = document.getElementById('bookSelector');
            if (bookSelector) {
                bookSelector.addEventListener('change', () => {
                    console.log('[Reader HTML] Book selector changed');
                    if (window.changeBook) {
                        window.changeBook();
                    }
                });
            }
            
            // Previous/Next chapter buttons
            const prevBtn = document.getElementById('prevChapter');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    console.log('[Reader HTML] Previous chapter clicked');
                    if (window.changeChapter) {
                        window.changeChapter(-1);
                    }
                });
            }
            
            const nextBtn = document.getElementById('nextChapter');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    console.log('[Reader HTML] Next chapter clicked');
                    if (window.changeChapter) {
                        window.changeChapter(1);
                    }
                });
            }
            
            // Toggle verse numbers button
            const toggleBtn = document.getElementById('toggleVerseNumbers');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    console.log('[Reader HTML] Toggle verse numbers clicked');
                    if (window.toggleVerseNumbers) {
                        window.toggleVerseNumbers();
                    }
                });
            }
            
            console.log('[Reader HTML] Event listeners setup complete');
        });
    </script>
    <script src="/js/read-aloud.js" defer></script>
</body>
</html>
