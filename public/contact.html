<!DOCTYPE html>
<html lang="en" data-theme="tanach">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tanach Reader</title>
    <meta name="description" content="Send feedback, questions or suggestions about Tanach Reader, the free online Hebrew and English Tanach.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/jewish-bible.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/jewish-bible.ico">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/read-aloud.css">
    <script src="/js/theme.js"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
    
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px 0;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        
        .nav-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            transition: background 0.3s ease;
            margin: 5px;
        }
        
        .content h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 2rem;
            text-align: center;
        }
        
        .content > p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-field {
            flex: 1 1 100%;
        }
        
        .form-field.half {
            flex: 1 1 calc(50% - 10px);
        }
        
        .form-field label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .form-field input,
        .form-field textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: #fff;
        }
        
        .form-field input:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-field textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .form-actions {
            text-align: center;
            margin-top: 30px;
        }
        
        .submit-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-button:active {
            transform: translateY(0);
        }
        
        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .form-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .form-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .form-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 30px;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 25px;
            }
            
            .content h2 {
                font-size: 1.6rem;
            }
            
            .form-field.half {
                flex: 1 1 100%;
            }
            
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.7rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .content h2 {
                font-size: 1.4rem;
            }
            
            .content > p {
                font-size: 1rem;
            }
            
            .form-field input,
            .form-field textarea {
                padding: 10px 12px;
                font-size: 0.95rem;
            }
            
            .submit-button {
                padding: 12px 30px;
                font-size: 1rem;
                width: 100%;
            }
            
        }
    </style>
</head>
<body class="page-gradient">
    <div class="container" id="main-content">
        <div class="header">
            <h1>📧 Contact</h1>
            <p>Tanach Reader - Jewish Bible Online</p>
            <div>
                <a href="/" class="nav-link">← Back to Home</a>
                <a href="/privacy.html" class="nav-link">Privacy Policy</a>
            </div>
        </div>
        
        <div class="content">
            <h2>Get in Touch</h2>
            <p>Questions about Tanach Reader? Feedback? Ideas for new features? Send us a message — we usually respond within 24 hours.</p>
            
            <form method="POST" action="https://formspree.io/f/xwplqeky" class="contact-form" id="contactForm">
                <div class="form-fields">
                    <div class="form-field half">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" placeholder="Your name" required />
                    </div>
                    <div class="form-field half">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="your.email@example.com" required />
                    </div>
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="6" placeholder="How can we make Tanach Reader better?" required></textarea>
                    </div>
                </div>
                
                <div class="form-message" id="formMessage"></div>
                
                <div class="form-actions">
                    <button type="submit" class="submit-button" id="submitButton">
                        <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i>
                        Send Message
                    </button>
                </div>
            </form>
        </div>
        
        <footer class="footer" data-site-footer>
            <p>&copy; <span data-copyright-years>2024</span> Tanach Reader - Authentic Jewish texts from Sefaria.org</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">
                <a href="/privacy.html" style="color: white; text-decoration: underline; opacity: 0.9;">Privacy Policy</a>
            </p>
            <ul class="social-icons" data-social-icons aria-label="Social links"></ul>
        </footer>
    </div>
    
    <script>
        // Update copyright year dynamically
        
        // Handle form submission
        const form = document.getElementById('contactForm');
        const submitButton = document.getElementById('submitButton');
        const formMessage = document.getElementById('formMessage');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable submit button
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Sending...';
            
            // Hide previous messages
            formMessage.className = 'form-message';
            formMessage.textContent = '';
            
            try {
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    formMessage.className = 'form-message success';
                    formMessage.textContent = 'Thank you! Your message has been sent. We will respond as soon as possible.';
                    form.reset();
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'An error occurred');
                }
            } catch (error) {
                formMessage.className = 'form-message error';
                formMessage.textContent = error.message || 'An error occurred while sending. Please try again later.';
            } finally {
                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Send Message';
            }
        });
    </script>
    <script type="module" src="/js/site-footer.js"></script>
    <script src="/js/read-aloud.js" defer></script>
</body>
</html>
